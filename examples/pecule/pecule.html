<title>Pécule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column; a banknote-engraved statement panel on top, ledger rows below, tab bar pinned to the bottom */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --line:#D6DFDA;
  --ink:#12201B; --muted:#56665F; --accent:#0D6A58; --accent-ink:#FFFFFF; --accent-soft:#D9EFE8;
  --hero:#0C3A31; --hero-ink:#EEF7F3; --hero-muted:#A9C9BF; --hero-track:rgba(238,247,243,.2); --hero-bad:#FFB3A8; --hero-chip:rgba(238,247,243,.13);
  --good:#1D8352; --warn:#9A5B00; --bad:#BF3A30;
  --good-soft:#DCF0E4; --warn-soft:#FAEBD3; --bad-soft:#F8DFDB;
  --c1:#2E68AC; --c2:#D06F22; --c3:#2A8468; --c4:#BF433B; --c5:#A9831A; --c6:#7650AA; --c7:#6B777D; --c8:#BB4A82; --c9:#86583A; --c10:#4655C8;
  --scrim:rgba(6,20,16,.48);
  --shadow:0 12px 30px -14px rgba(12,58,49,.45);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:16px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1311; --surface:#131D1A; --surface-2:#19251F; --line:#27362F;
    --ink:#E4EDE9; --muted:#97A9A1; --accent:#48C2A3; --accent-ink:#04211A; --accent-soft:#143A31;
    --hero:#0F4237; --hero-ink:#ECF7F2; --hero-muted:#9FC6BA; --hero-track:rgba(236,247,242,.17);
    --good:#4CC489; --warn:#E8A33C; --bad:#F2766B;
    --good-soft:#123826; --warn-soft:#3A2A10; --bad-soft:#3E1B18;
    --c1:#6EA6E6; --c2:#EE9E5A; --c3:#56C6A0; --c4:#EE7A70; --c5:#DDBB4C; --c6:#B08FE4; --c7:#A0ADB3; --c8:#E888B7; --c9:#C99068; --c10:#97A2FF;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#131D1A; --surface-2:#19251F; --line:#27362F;
  --ink:#E4EDE9; --muted:#97A9A1; --accent:#48C2A3; --accent-ink:#04211A; --accent-soft:#143A31;
  --hero:#0F4237; --hero-ink:#ECF7F2; --hero-muted:#9FC6BA; --hero-track:rgba(236,247,242,.17);
  --good:#4CC489; --warn:#E8A33C; --bad:#F2766B;
  --good-soft:#123826; --warn-soft:#3A2A10; --bad-soft:#3E1B18;
  --c1:#6EA6E6; --c2:#EE9E5A; --c3:#56C6A0; --c4:#EE7A70; --c5:#DDBB4C; --c6:#B08FE4; --c7:#A0ADB3; --c8:#E888B7; --c9:#C99068; --c10:#97A2FF;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:620px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom, 0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 120;font-size:1.4rem;letter-spacing:-.01em}
.mark{width:24px;height:24px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4.5px var(--accent-ink);flex:none}
.mode{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.75rem;font-weight:600;color:var(--muted);white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.mode.cloud i{background:var(--good)} .mode.demo i{background:var(--warn)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem;color:var(--muted)}

/* views */
.view{display:flex;flex-direction:column;gap:14px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav h1{margin:0;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 108;font-size:1.12rem;text-transform:capitalize;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:default}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 20px 18px;box-shadow:var(--shadow)}
#guilloche{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--hero-muted)}
.big{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 112;font-size:clamp(2.5rem,12vw,3.6rem);line-height:1.02;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.neg{color:var(--hero-bad)}
.hero-sub{margin-top:6px;color:var(--hero-muted);font-size:.93rem}
.hero-sub b{color:var(--hero-ink);font-weight:600}
.meter{position:relative;height:10px;border-radius:99px;background:var(--hero-track);margin-top:18px}
.meter>span{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--hero-ink)}
.meter>span.over{background:var(--hero-bad)}
.meter>i{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:2px;background:var(--hero-ink);opacity:.75}
.hero-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--hero-muted)}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.pace{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--hero-chip);font-size:.8rem;font-weight:600}
.pace.ahead{color:var(--hero-bad)}
.calc{font-family:var(--f-mono);font-size:.72rem;color:var(--hero-muted)}
.paydays{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.payday{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--hero-chip);font-size:.78rem;color:var(--hero-muted)}
.payday b{color:var(--hero-ink);font-weight:600}
.payday::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;box-sizing:border-box;border:1.5px solid var(--hero-muted)}
.payday.ok::before{background:var(--hero-ink);border-color:var(--hero-ink)}
.payday.past::before{background:var(--hero-muted)}
.savs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sav{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sav:first-child{border-top:0;padding-top:0}
.sav-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sav .mono{font-size:.88rem;white-space:nowrap}
.sav button.pill{border:0;cursor:pointer;font:inherit;font-size:.72rem;font-weight:700}
.sav.done .sav-name{color:var(--muted)}
.plan-h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.savs + .plan-h{margin-top:16px}
.btn.mark-btn{padding:6px 10px;font-size:.78rem;border-color:var(--accent);color:var(--accent)}
.warn-box .btn{margin-left:2px;padding-block:2px}
.hero .btn{margin-top:14px;background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin:0 0 12px;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 106;font-size:1.02rem;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-wrap:balance}
.card h2 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.welcome{border-color:var(--accent);background:var(--accent-soft)}
.welcome ol{margin:4px 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:4px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.confirm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.small{padding:7px 11px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}

/* categories */
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sw{width:12px;height:12px;border-radius:4px;background:var(--c)}
.cat-main{min-width:0}
.cat-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.cat-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-amt{font-size:.8rem;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:6px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--c)}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.foot-note{margin-top:14px;font-size:.82rem;color:var(--muted)}

/* transactions */
.txs{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.day-h:first-child{padding-top:0}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer;color:var(--ink)}
.day-h + .tx{border-top:0}
.tx:hover .tx-label{text-decoration:underline;text-decoration-color:var(--line)}
.tx-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;color:var(--surface);background:var(--c)}
.tx-main{min-width:0;display:flex;flex-direction:column}
.tx-label{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-size:.92rem;font-weight:500;white-space:nowrap}
.tx-amt.in{color:var(--good)}
.tx-amt.save{color:var(--c1)}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.totals b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.search{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.84rem;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c, var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c, var(--accent));box-shadow:inset 0 0 0 1px var(--c, var(--accent));background:var(--surface-2)}

/* charts */
.chart{width:100%;min-height:150px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ideal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.ch-line{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent);opacity:.12}
.ch-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.ch-txt{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.ch-val{fill:var(--ink);font-family:var(--f-mono);font-size:10.5px}
.ch-bar{fill:var(--accent)}
.ch-bar.over{fill:var(--bad)}
.ch-bar.cur{opacity:.55}
.ch-bar.oneoff{fill:var(--c10)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2.4px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:1.5px dashed var(--muted)}
.legend i.sq{width:10px;height:10px;border:0;border-radius:3px;background:var(--c10);vertical-align:-1px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{position:relative}
.money input{padding-right:30px;font-family:var(--f-mono);text-align:right}
.money::after{content:"€";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono);pointer-events:none}
.hint{font-size:.8rem;color:var(--muted)}
.edit-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.edit-row{display:grid;grid-template-columns:auto 1fr 112px auto;gap:8px;align-items:center}
.edit-row.nofix{grid-template-columns:1fr 112px auto}
.edit-row .sw{width:14px;height:14px}
.edit-row.inc,.edit-head{grid-template-columns:1fr 104px 52px 36px}
.edit-head{display:grid;gap:8px;margin:12px 0 4px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.day-in{text-align:center;font-family:var(--f-mono);padding-inline:4px}
.x-btn{width:36px;height:40px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex:none}
.x-btn:hover{color:var(--bad);border-color:var(--bad-soft)}
.x-btn.confirm{background:var(--bad);color:var(--surface);font-size:.7rem;font-weight:700;width:auto;padding:0 8px}
.x-btn[disabled]{visibility:hidden}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-top:6px}
.sum-line b{font-family:var(--f-mono);font-weight:500}
.avail{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.avail strong{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 110;font-size:1.5rem;font-variant-numeric:tabular-nums}

/* notifications guide */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.steps{list-style:none;counter-reset:s;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;min-width:0}
.steps>li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:800;font-size:.85rem}
.steps>li>div{min-width:0}
.codebox{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;min-width:0}
.codebox code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-family:var(--f-mono);font-size:.8rem;user-select:all;-webkit-user-select:all;padding-block:4px}
kbd{font-family:var(--f-mono);font-size:.82em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
details{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
details ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.parse-out{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:.9rem}
.parse-out dt{color:var(--muted)} .parse-out dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 108;font-size:1.15rem}
.paste{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.paste label{color:var(--accent)}
.paste textarea{background:transparent;border:0;padding:6px 0 2px;min-height:44px}
.paste textarea:focus{outline:none}
.paste:focus-within{border-style:solid}
.parsed{font-size:.84rem;font-weight:600;color:var(--accent)}
.parsed.miss{color:var(--warn)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:2px}
.amount:focus-within{border-color:var(--accent)}
.amount input{border:0;background:none;padding:2px 0;border-radius:0;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 110;font-size:2.5rem;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}

<script>
(() => {
'use strict';

/* Lien de la page publiée : sert aux automatisations du téléphone. */
const APP_LINK = 'https://claude.ai/artifact/5sBjhzjZE4wAhxH8JbwPSG';
const LS_KEY = 'pecule:v1';

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtC = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const fmt0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const eur = n => fmtC.format(n || 0).replace('-', '−');
const eur0 = n => fmt0.format(Math.round(n || 0)).replace('-', '−');
const round2 = n => Math.round(n * 100) / 100;
const sum = arr => arr.reduce((a, t) => a + (t.amount || 0), 0);
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;

const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MONTHS_S = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoDate(new Date());
const curYM = () => todayISO().slice(0, 7);
const ymShift = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
function dayLabel(iso) {
  if (iso === todayISO()) return "Aujourd'hui";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === isoDate(y)) return 'Hier';
  const [a, b, c] = iso.split('-').map(Number);
  return new Date(a, b - 1, c).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

/*PARSER-START*/
const stripAccents = s => s.normalize('NFD').replace(/\p{M}+/gu, '');
function normKey(s) { return stripAccents(String(s || '').toLowerCase()).replace(/[^a-z0-9]+/g, ' ').trim(); }
function memKey(s) { return normKey(s).split(' ').slice(0, 2).join(' '); }

function toNumber(str) {
  let s = String(str ?? '').replace(/[\s  ']/g, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    const dec = lc > ld ? ',' : '.';
    s = s.split(dec === ',' ? '.' : ',').join('').replace(dec, '.');
  } else if (lc > -1) {
    s = /,\d{1,2}$/.test(s) ? s.replace(/,/g, (m, i) => (i === lc ? '.' : '')) : s.replace(/,/g, '');
  } else if (ld > -1) {
    s = /\.\d{1,2}$/.test(s) ? s.replace(/\./g, (m, i) => (i === ld ? '.' : '')) : s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : NaN;
}

const NUM = String.raw`\d{1,3}(?:[ .]\d{3})+(?:,\d{1,2})?|\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:[.,]\d{1,2})?`;
const RE_AMT_AFTER = new RegExp(String.raw`([-+−]?)\s?(${NUM})\s?(?:€|eur(?:os?)?(?![a-z]))`, 'i');
const RE_AMT_BEFORE = new RegExp(String.raw`(?:€|eur(?![a-z]))\s?([-+−]?)\s?(${NUM})`, 'i');
const RE_AMT_BARE = /(?<![\d.,])(\d{1,6},\d{2})(?!\d)/;
const RE_INCOME = /(vous avez re[çc]u|tu as re[çc]u|virement re[çc]u|virement entrant|a [ée]t[ée] cr[ée]dit[ée]|cr[ée]dit de|remboursement|rembours[ée]|salaire|acompte|\bpaie\b|you received|refund)/i;
const BANKS = String.raw`cr[ée]dit agricole|cr[ée]dit mutuel|soci[ée]t[ée] g[ée]n[ée]rale|bnp paribas|bnp|lcl|la banque postale|banque postale|boursorama banque|boursorama|boursobank|revolut|n26|lydia|sumeria|qonto|shine|hello ?bank!?|fortuneo|monabanq|caisse d'[ée]pargne|banque populaire|cic|ing|orange bank|nickel|wise|bforbank|ma french bank|google wallet|apple wallet|wallet`;
const RE_BANKS = new RegExp(String.raw`(?<![\p{L}\d])(?:${BANKS})(?![\p{L}\d])`, 'giu');
const RE_SAVE = /(livret|\blddS?\b|\blep\b|\bpel\b|\bcel\b|assurance[- ]vie|compte [ée]pargne|vers (?:votre |ton |mon )?[ée]pargne|virement [ée]pargne|mise de c[ôo]t[ée]|tirelire|coffre)/i;
const STOPS = String.raw`virement [ée]mis|virement interne|virement permanent|virement programm[ée]|virement|vers|[ée]mis|re[çc]u|nouvelle op[ée]ration|nouvelle transaction|nouvelle d[ée]pense|nouveau paiement|op[ée]ration par carte|op[ée]ration carte|op[ée]ration cb|op[ée]ration|transaction|paiement par carte|paiement carte|paiement cb|paiement sans contact|paiement mobile|paiement|payment|achat cb|achat carte|achat|d[ée]pense|d[ée]bit carte|d[ée]bit cb|d[ée]bit|pr[ée]l[èe]vement|retrait|carte bancaire|carte|cb|card|visa|mastercard|vous avez pay[ée]|tu as pay[ée]|you paid|pay[ée]e?|accept[ée]e?|autoris[ée]e?|effectu[ée]e?|valid[ée]e?|r[ée]alis[ée]e?|sans contact|apple pay|google pay|samsung pay|de|du|des|d'|en|sur|par|pour|chez|aupr[èe]s de|à|at|votre|ta|ton|montant|euros?|eur|€|notification|alerte|info`;
const RE_EDGE_START = new RegExp(String.raw`^(?:${STOPS})(?![\p{L}\d])`, 'iu');
const RE_EDGE_END = new RegExp(String.raw`(?<![\p{L}\d])(?:${STOPS})$`, 'iu');
const RE_PREP = /(?:^|\s)(?:chez|aupr[èe]s de|à|at|@)\s+(.+)/i;
const RE_CUT = /\s(?:le|du|au)\s+(?=\d)|\s(?:via|avec|par|pour|depuis|sur (?:votre|ta|ton|le compte)|a [ée]t[ée]|est|solde|nouveau solde|montant)\s|[.!?;|]\s|\s[-–—]\s/i;

function titleCase(s) {
  if (/[a-zà-ÿ]/.test(s) || s.length <= 3) return s;
  return s.split(' ').map(w => (w.length <= 3 && /^[A-Z&]+$/.test(w) ? w : w.charAt(0) + w.slice(1).toLowerCase())).join(' ');
}

const RE_AMT_ANY = new RegExp(String.raw`[-+−]?\s?(?:${NUM})\s?(?:€|eur(?:os?)?(?![a-z]))`, 'gi');
const RE_TAIL = /(?<![\p{L}\d])(?:le|hier|aujourd'hui|ce jour|today)$/iu;
const RE_PROC = /^(?:sumup|sum up|zettle|izettle|sq|paypal|lyf|stripe|sp)\s*\*\s*/i;
const RE_PUNCT = /^[\s:·•\-–—,.!>»«"“”'()*]+|[\s:·•\-–—,.!<»«"“”'()*]+$/g;

function cleanMerchant(raw, fromStart) {
  const pieces = String(raw || '').split(RE_CUT).map(p => p && p.trim()).filter(Boolean);
  if (!pieces.length) return '';
  const order = fromStart ? pieces : pieces.slice().reverse();
  for (const piece of order) {
    let v = piece.replace(RE_BANKS, ' ')
      .replace(/(?:\*{2,}|x{2,}|•+)\s?\d{2,4}/gi, ' ')
      .replace(/\bcarte\s+\d{4}\b/gi, ' ')
      .replace(/(?<!\d)\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?(?!\d)/g, ' ')
      .replace(/(?<!\d)\d{1,2}\s?[h:]\s?\d{2}(?!\d)/gi, ' ')
      .replace(RE_AMT_ANY, ' ')
      .replace(/\s{2,}/g, ' ');
    let prev;
    do {
      prev = v;
      v = v.replace(RE_PUNCT, '').replace(RE_EDGE_START, '').replace(RE_EDGE_END, '').replace(RE_TAIL, '').replace(RE_PROC, '').trim();
    } while (v !== prev);
    v = v.replace(/\*/g, ' ').replace(/\s{2,}/g, ' ').trim();
    if (/\p{L}/u.test(v) && v.length >= 2) return titleCase(v).slice(0, 40).trim();
  }
  return '';
}

function extractMerchant(before, after) {
  const cands = [];
  const pa = RE_PREP.exec(after); if (pa) cands.push([pa[1], true]);
  const pb = RE_PREP.exec(before); if (pb) cands.push([pb[1], true]);
  cands.push([after, true], [before, false]);
  for (const [c, fromStart] of cands) { const v = cleanMerchant(c, fromStart); if (v) return v; }
  return '';
}

function extractDate(text, now) {
  const m = /(?<!\d)(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?(?!\d)/.exec(text);
  if (m) {
    const d = +m[1], mo = +m[2];
    let y = m[3] ? +m[3] : now.getFullYear();
    if (y < 100) y += 2000;
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) {
      const dt = new Date(y, mo - 1, d);
      if (dt.getMonth() === mo - 1) {
        if (!m[3] && dt > now) dt.setFullYear(y - 1);
        return isoDate(dt);
      }
    }
  }
  if (/(?<![\p{L}])(hier|yesterday)(?![\p{L}])/iu.test(text)) { const dt = new Date(now); dt.setDate(dt.getDate() - 1); return isoDate(dt); }
  return isoDate(now);
}

function parseNotif(raw, now = new Date()) {
  const text = String(raw || '').replace(/[   ]/g, ' ').replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (!text) return null;
  let m = RE_AMT_AFTER.exec(text), sign = '', numStr = null;
  if (m) { sign = m[1]; numStr = m[2]; }
  else if ((m = RE_AMT_BEFORE.exec(text))) { sign = m[1]; numStr = m[2]; }
  else if ((m = RE_AMT_BARE.exec(text))) { numStr = m[1]; }
  let amount = null;
  if (m) { const n = Math.abs(toNumber(numStr)); if (n > 0 && n < 1e7) amount = round2(n); }
  const before = m ? text.slice(0, m.index) : text;
  const after = m ? text.slice(m.index + m[0].length) : '';
  let kind = RE_INCOME.test(text) ? 'in' : 'out';
  if (sign === '+') kind = 'in';
  if (sign === '-' || sign === '−') kind = 'out';
  if (kind === 'out' && RE_SAVE.test(text)) kind = 'save';
  return { amount, kind, label: extractMerchant(before, after), date: extractDate(before + ' ' + after, now) };
}

const KEYWORDS = [
  ['exceptionnel', ['taxe', 'impot', 'amende', 'contravention', 'antai', 'dgfip', 'tresor public', 'finances publiques', 'spf finances', 'notaire', 'mise en circulation', 'carte grise', 'ants', 'huissier']],

function normalizeSettings(raw) {
  const d = defaultSettings();
  if (!raw || typeof raw !== 'object') return d;
  const num = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0 ? v : 0);
  const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
  const cats = Array.isArray(raw.cats)
    ? raw.cats.filter(c => c && typeof c.id === 'string' && c.id).map(c => ({ id: str(c.id, 40), name: str(c.name, 40), color: Number.isInteger(c.color) && c.color >= 1 && c.color <= 10 ? c.color : 7, budget: num(c.budget), ...(c.oneoff === true ? { oneoff: true } : {}) }))
    : d.cats;
  if (!cats.some(c => c.id === 'autre')) cats.push({ id: 'autre', name: 'Autre', color: 7, budget: 0 });
  const fixed = Array.isArray(raw.fixed) ? raw.fixed.filter(f => f && typeof f === 'object').map(f => ({ id: str(f.id, 40) || rid('f'), name: str(f.name, 40), amount: num(f.amount) })) : [];
  const memory = {};
  if (raw.memory && typeof raw.memory === 'object') for (const [k, v] of Object.entries(raw.memory)) if (typeof v === 'string') memory[k.slice(0, 60)] = v.slice(0, 40);
  let incomes = Array.isArray(raw.incomes)
    ? raw.incomes.filter(i => i && typeof i === 'object').map(i => ({ id: str(i.id, 40) || rid('i'), name: str(i.name, 40), amount: num(i.amount), day: Number.isInteger(i.day) && i.day >= 1 && i.day <= 31 ? i.day : 0 }))
    : [];
  if (!Array.isArray(raw.incomes) && num(raw.income) > 0) incomes = [{ id: 'i1', name: 'Salaire', amount: num(raw.income), day: 0 }];
  let savings = Array.isArray(raw.savings)
    ? raw.savings.filter(a => a && typeof a === 'object').map(a => ({ id: str(a.id, 40) || rid('s'), name: str(a.name, 40), amount: num(a.amount) }))
    : [];
  if (!Array.isArray(raw.savings) && num(raw.savings) > 0) savings = [{ id: 's1', name: 'Épargne', amount: num(raw.savings) }];
  return { v: 3, incomes, savings, fixed, cats, memory };
}

function cleanTx(id, t, ym) {
  if (!t || typeof t !== 'object') return null;
  const amount = typeof t.amount === 'number' && Number.isFinite(t.amount) && t.amount > 0 ? t.amount : 0;
  if (!amount) return null;
  const date = typeof t.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.date) ? t.date : `${ym}-01`;
  return { id, ym, amount, kind: ['in', 'save', 'fixed'].includes(t.kind) ? t.kind : 'out', sav: typeof t.sav === 'string' ? t.sav.slice(0, 40) : '', fix: typeof t.fix === 'string' ? t.fix.slice(0, 40) : '', label: typeof t.label === 'string' ? t.label.slice(0, 60) : '', cat: typeof t.cat === 'string' ? t.cat : 'autre', date, src: t.src === 'notif' ? 'notif' : 'manuel', created: typeof t.created === 'number' ? t.created : 0, inc: typeof t.inc === 'string' ? t.inc.slice(0, 40) : '' };
}

const real = { settings: defaultSettings(), months: {}, hasSettings: false, hasData: false };
let demo = null;
const S = { store: 'loading', demo: false, loaded: false, view: 'mois', ym: curYM(), filter: 'all', q: '', note: '', platform: /android/i.test(navigator.userAgent) ? 'android' : 'ios', advice: null, test: '' };
const caps = { downloads: null, sample: null };
const cur = () => (S.demo ? demo : real);

function txOf(ym) {
  const m = cur().months[ym];
  if (!m || !m.tx || typeof m.tx !== 'object') return [];
  const out = [];
  for (const [id, t] of Object.entries(m.tx)) { const c = cleanTx(id, t, ym); if (c) out.push(c); }
  return out;
}
const byNewest = (a, b) => (b.date.localeCompare(a.date) || b.created - a.created);
function catOf(id, st) { return st.cats.find(c => c.id === id) || st.cats.find(c => c.id === 'autre') || { id: 'autre', name: 'Autre', color: 7, budget: 0 }; }
const catName = (c) => c.name || 'Sans nom';

function stats(ym) {
  const st = cur().settings;
  const txs = txOf(ym);
  const out = txs.filter(t => t.kind === 'out');
  const inc = txs.filter(t => t.kind === 'in');
  const dim = daysIn(ym), now = curYM();
  const isCurrent = ym === now, isPast = ym < now, isFuture = ym > now;
  const today = new Date().getDate();
  /* Chaque versement prévu (acompte, solde…) compte pour son montant prévu,
     remplacé par le montant réellement reçu dès qu'une opération y est reliée. */
  const sources = st.incomes.map(i => {
    const got = inc.filter(t => t.inc === i.id);
    return { ...i, day: i.day ? Math.min(i.day, dim) : 0, actual: sum(got), received: got.length > 0, value: got.length ? sum(got) : i.amount };
  });
  const ids = new Set(st.incomes.map(i => i.id));
  const spent = sum(out), extra = sum(inc.filter(t => !ids.has(t.inc)));
  /* Charges fixes : montant prévu, remplacé par le paiement noté (« Marquer payé »).
     Un paiement de charge fixe n'est jamais compté en plus comme dépense. */
  const fixedTx = txs.filter(t => t.kind === 'fixed');
  const bills = st.fixed.map(f => {
    const got = fixedTx.filter(t => t.fix === f.id);
    return { ...f, actual: sum(got), done: got.length > 0, value: got.length ? sum(got) : f.amount, tx: got[0] || null };
  });
  const billIds = new Set(st.fixed.map(f => f.id));
  const fixed = bills.reduce((a, b) => a + b.value, 0) + sum(fixedTx.filter(t => !billIds.has(t.fix)));
  const base = st.incomes.reduce((a, i) => a + i.amount, 0);
  const income = sources.reduce((a, x) => a + x.value, 0) + extra;
  /* Même logique pour l'épargne : montant prévu par compte, remplacé par le
     virement réellement noté ce mois-ci. Un virement d'épargne n'est jamais une dépense. */
  const saves = txs.filter(t => t.kind === 'save');
  const pots = st.savings.map(a => {
    const got = saves.filter(t => t.sav === a.id);
    return { ...a, actual: sum(got), done: got.length > 0, value: got.length ? sum(got) : a.amount, tx: got[0] || null };
  });
  const potIds = new Set(st.savings.map(a => a.id));
  const extraSaved = sum(saves.filter(t => !potIds.has(t.sav)));
  const saving = pots.reduce((a, p) => a + p.value, 0) + extraSaved;
  const plannedSaving = st.savings.reduce((a, p) => a + p.amount, 0);
  const available = income - fixed - saving;
  const remaining = available - spent;
  const byCat = {};
  for (const t of out) { const c = catOf(t.cat, st).id; byCat[c] = (byCat[c] || 0) + t.amount; }
  const dayIdx = isCurrent ? today : isPast ? dim : 0;
  const daysLeft = isCurrent ? dim - today + 1 : 0;
  /* Les dépenses ponctuelles réduisent le reste à dépenser mais pas le rythme. */
  const oneoffIds = new Set(st.cats.filter(c => c.oneoff).map(c => c.id));
  const oneoff = sum(out.filter(t => oneoffIds.has(catOf(t.cat, st).id)));
  const expected = (available - oneoff) * dayIdx / dim;
  return { txs, out, inc, saves, pots, bills, fixedTx, extraSaved, saving, plannedSaving, spent, extra, fixed, income, base, sources, available, remaining, byCat, dim, isCurrent, isPast, isFuture, today, dayIdx, daysLeft, expected, perDay: daysLeft > 0 ? remaining / daysLeft : null, delta: (spent - oneoff) - expected, oneoff, oneoffIds };
}

/* ---------- storage ---------- */
let cloud = null, readyResolve;
const ready = new Promise(r => { readyResolve = r; });
const queues = new Map();
function enqueue(key, fn) { const p = (queues.get(key) || Promise.resolve()).catch(() => {}).then(fn); queues.set(key, p); return p; }
function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ settings: real.settings, months: real.months })); } catch (e) { /* stockage indisponible */ } }
function applyMem(state, ym, id, tx) {
  const m = state.months[ym] ? { tx: { ...(state.months[ym].tx || {}) } } : { tx: {} };
  if (tx) m.tx[id] = tx; else delete m.tx[id];
  state.months = { ...state.months, [ym]: m };
}

async function putTx(ym, id, tx) {
  if (S.demo) { applyMem(demo, ym, id, tx); render(); return; }
  await ready;
  if (S.store === 'local') { applyMem(real, ym, id, tx); real.hasData = true; persistLocal(); render(); return; }
  const ref = cloud.col.doc('m-' + ym);
  const known = !!real.months[ym];
  return enqueue(ref.path, async () => {
    try { await ref.update({ tx: { [id]: tx } }); }
    catch (e) { if (!known && e && e.code === 'invalid_argument') await ref.set({ tx: { [id]: tx } }); else throw e; }
  });
}
async function delTx(ym, id) {
  if (S.demo) { applyMem(demo, ym, id, null); render(); return; }
  await ready;
  if (S.store === 'local') { applyMem(real, ym, id, null); persistLocal(); render(); return; }
  const ref = cloud.col.doc('m-' + ym);
  return enqueue(ref.path, () => ref.update({ tx: { [id]: null } }));
}

let setTimer = null, pendingSet = null;
function saveSettings(next, immediate) {
  if (S.demo) { demo.settings = next; return; }
  real.settings = next; real.hasSettings = true; real.hasData = true;
  if (S.store === 'local') { persistLocal(); return; }
  if (S.store !== 'cloud') { pendingSet = next; return; }
  pendingSet = next;
  clearTimeout(setTimer);
  setTimer = setTimeout(flushSettings, immediate ? 0 : 700);
}
function flushSettings() {
  if (!pendingSet || !cloud) return;
  const data = clone(pendingSet);
  const ref = cloud.col.doc('settings');
  enqueue(ref.path, () => ref.set(data)).catch(e => toast(writeError(e), 'bad')).finally(() => { if (pendingSet === null) render(true); });
  pendingSet = null;
}
function writeError(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') return "Espace de stockage plein : exporte puis supprime d'anciennes opérations.";
  if (code === 'invalid_argument') return "Enregistrement refusé : tu n'as peut-être que l'accès en lecture à cette page.";
  return "Pas enregistré : la connexion a échoué. Réessaie dans un instant.";
}

function startLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      real.settings = normalizeSettings(raw.settings);
      real.months = raw.months && typeof raw.months === 'object' ? raw.months : {};
      real.hasSettings = !!raw.settings;
      real.hasData = real.hasSettings || Object.keys(real.months).length > 0;
    }
  } catch (e) { /* stockage illisible : on repart de zéro */ }
  if (pendingSet) { real.settings = pendingSet; pendingSet = null; persistLocal(); }
  S.store = 'local'; S.loaded = true; readyResolve();
  render();
}

let loadTimer = null;
function onCloudSnap(snap) {
  let settingsRaw = null;
  const months = {};
  for (const d of snap.docs) {
    if (!d.exists) continue;
    if (d.id === 'settings') settingsRaw = d.data();
    else if (d.id.startsWith('m-')) months[d.id.slice(2)] = d.data();
  }
  if (!pendingSet) { real.settings = normalizeSettings(settingsRaw); real.hasSettings = !!settingsRaw; }
  real.months = months;
  real.hasData = real.hasSettings || Object.keys(months).length > 0;
  if (!snap.metadata.fromCache) { clearTimeout(loadTimer); S.note = ''; }
  S.loaded = true;
  render(true);
}

async function initStore() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { startLocal(); return; }
  loadTimer = setTimeout(() => {
    if (!S.loaded) { S.note = 'Tes données mettent du temps à arriver. Elles s\'afficheront dès que la connexion répond.'; render(); }
  }, 10000);
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { /* pas de stockage cloud */ }
  const uid = user ? await user.id() : null;
  if (!db || !uid) { clearTimeout(loadTimer); startLocal(); }
  else {
    cloud = { col: db.collection('data/users/' + uid) };
    S.store = 'cloud'; readyResolve();
    if (pendingSet) flushSettings();
    cloud.col.onSnapshot(onCloudSnap, err => {
      clearTimeout(loadTimer);
      S.loaded = true;
      S.note = `Impossible de lire tes données pour le moment (${esc(err && err.code)}). Recharge la page un peu plus tard.`;
      render();
    });
    render();
  }
  c.use('downloads').then(d => { caps.downloads = d; render(true); }).catch(() => {});
  c.use('sample').then(s => { caps.sample = s; render(true); }).catch(() => {});
}

  if (!(s.base > 0)) {
    return `<section class="hero"><canvas id="guilloche" aria-hidden="true"></canvas>
      <div class="eyebrow">Dépensé en ${esc(mName)}</div>
      <div class="big">${eur(s.spent)}</div>
      <div class="hero-sub">${plural(s.out.length, 'dépense', 'dépenses')}. Indique tes revenus (salaire, acompte, solde…) pour savoir combien il te reste.</div>
      <button class="btn" type="button" data-go="budgets">Indiquer mes revenus</button></section>`;
  }
  const over = s.remaining < 0;
  const pct = s.available > 0 ? Math.min(100, s.spent / s.available * 100) : 100;
  let eyebrow = 'Reste à dépenser', sub;
  if (s.isCurrent) {
    sub = over ? `Budget dépassé de <b>${eur(-s.remaining)}</b>` : `Soit <b>${eur(s.perDay)}</b> par jour pendant ${plural(s.daysLeft, 'jour', 'jours')}`;
  } else if (s.isPast) {
    eyebrow = 'Solde du mois';
    sub = over ? `Mois terminé avec <b>${eur(-s.remaining)}</b> de dépassement` : `Mois terminé avec <b>${eur(s.remaining)}</b> de marge`;
  } else { eyebrow = 'Disponible'; sub = 'Budget prévu pour ce mois'; }
  let pace = '';
  if (s.isCurrent && s.available > 0) {
    const tol = Math.max(5, s.available * 0.02);
    if (Math.abs(s.delta) < tol) pace = '<span class="pace">Pile dans ton rythme</span>';
    else if (s.delta > 0) pace = `<span class="pace ahead">${eur0(s.delta)} au-dessus de ton rythme</span>`;
    else pace = `<span class="pace">${eur0(-s.delta)} sous ton rythme</span>`;
  }
  const calcParts = [`${eur0(s.income)} revenus`];
  if (s.fixed) calcParts.push(`${eur0(s.fixed)} fixes`);
  if (s.saving) calcParts.push(`${eur0(s.saving)} épargne`);
  const marker = s.isCurrent ? `<i style="left:${(s.dayIdx / s.dim * 100).toFixed(1)}%" title="Aujourd'hui"></i>` : '';
  return `<section class="hero"><canvas id="guilloche" aria-hidden="true"></canvas>
    <div class="eyebrow">${eyebrow}</div>
    <div class="big${over ? ' neg' : ''}">${eur(s.remaining)}</div>
    <div class="hero-sub">${sub}</div>${paydaysHTML(s)}
    <div class="meter" role="img" aria-label="${Math.round(pct)} % du budget dépensé"><span class="${over ? 'over' : ''}" style="width:${pct.toFixed(1)}%"></span>${marker}</div>
    <div class="hero-row"><span>Dépensé ${eur(s.spent)}</span><span>Budget ${eur(s.available)}</span></div>
    <div class="hero-foot">${pace}<span class="calc">${esc(calcParts.join(' − '))}</span></div>
  </section>`;
}

function paydaysHTML(s) {
  if (!s.sources.length) return '';
  const chips = s.sources.map(x => {
    let cls = 'wait', status = x.day ? `le ${x.day}` : '';
    if (x.received) { cls = 'ok'; status = 'reçu'; }
    else if (s.isPast || (s.isCurrent && x.day && x.day <= s.today)) cls = 'past';
    else if (s.isCurrent && x.day) { const n = x.day - s.today; status = `le ${x.day}, dans ${plural(n, 'jour', 'jours')}`; }
    return `<span class="payday ${cls}"><b>${esc(x.name || 'Revenu')}</b> ${esc(eur0(x.value))}${status ? ' · ' + esc(status) : ''}</span>`;
  });
  return `<div class="paydays" aria-label="Versements du mois">${chips.join('')}</div>`;
}

/* « Ce mois-ci » : charges fixes et épargne à cocher dès qu'elles sont parties. */
function planRow(item, type, s) {
  const doneWord = type === 'fixed' ? 'payé' : 'versé';
  const name = item.name || (type === 'fixed' ? 'Charge fixe' : 'Épargne');
  let action;
  if (item.done) action = `<button class="pill good" type="button" data-tx="${esc(item.tx.id)}" data-ym="${esc(item.tx.ym)}" aria-label="${esc(name)} : ${doneWord}, modifier ou annuler">✓ ${doneWord}</button>`;
  else if (s.isFuture) action = '<span class="pill">prévu</span>';
  else action = `<button class="btn small mark-btn" type="button" data-act="mark" data-type="${type}" data-id="${esc(item.id)}">Marquer ${doneWord}</button>`;
  const diff = item.done && Math.abs(item.actual - item.amount) >= 1 ? ` <span class="muted">/ ${eur0(item.amount)}</span>` : '';
  return `<li class="sav${item.done ? ' done' : ''}"><span class="sav-name">${esc(name)}</span><span class="mono">${eur0(item.value)}${diff}</span>${action}</li>`;
}

function planHTML(s) {
  const bills = s.bills.filter(b => b.amount > 0 || b.done);
  const pots = s.pots.filter(p => p.amount > 0 || p.done);
  if (!bills.length && !pots.length && !s.extraSaved) return '';
  const all = bills.concat(pots);
  const doneCount = all.filter(x => x.done).length;
  let body = '';
  if (bills.length) body += `<div class="plan-h">Charges fixes</div><ul class="savs">${bills.map(b => planRow(b, 'fixed', s)).join('')}</ul>`;
  if (pots.length || s.extraSaved) {
    const extra = s.extraSaved ? `<li class="sav done"><span class="sav-name">Autre épargne</span><span class="mono">${eur0(s.extraSaved)}</span><span class="pill good">✓ versé</span></li>` : '';
    body += `<div class="plan-h">Épargne</div><ul class="savs">${pots.map(p => planRow(p, 'save', s)).join('')}${extra}</ul>`;
  }
  const yearly = s.plannedSaving * 12;
  const pct = s.income > 0 && s.saving > 0 ? Math.round(s.saving / s.income * 100) : null;
  const notes = [];
  if (!s.isFuture && doneCount < all.length) notes.push('Dès qu’un prélèvement ou un virement est parti, touche « Marquer payé » ou « Marquer versé ». Coller sa notification fait la même chose.');
  if (yearly) notes.push(`Épargne : ${pct !== null ? pct + ' % de tes revenus, ' : ''}soit ${eur0(yearly)} de côté en un an.`);
  return `<section class="card"><h2>Ce mois-ci <small>${all.length ? `${doneCount} sur ${all.length} réglé${doneCount > 1 ? 's' : ''}` : ''}</small></h2>
    ${body}${notes.length ? `<p class="foot-note">${esc(notes.join(' '))}</p>` : ''}
  </section>`;
}

function welcomeHTML() {
  return `<section class="card welcome"><h2>Bienvenue dans Pécule</h2>
    <ol><li>Note tes revenus (acompte, solde…) et tes charges fixes dans <b>Budgets</b>.</li><li>Relie les notifications de ta banque dans <b>Notifs</b>.</li><li>Ajoute ta première dépense avec le bouton <b>+</b>.</li></ol>
    <div class="row"><button class="btn primary" type="button" data-go="budgets">Commencer</button><button class="btn" type="button" data-act="demo-on">Voir un exemple rempli</button></div></section>`;
}

function catsHTML(s) {
  const st = cur().settings;
  const rows = st.cats.map(c => ({ c, spent: s.byCat[c.id] || 0 })).filter(r => r.c.budget > 0 || r.spent > 0).sort((a, b) => b.spent - a.spent || b.c.budget - a.c.budget);
  if (!rows.length) return `<section class="card"><h2>Catégories</h2><p class="muted">Rien à afficher pour ce mois. Fixe un budget par catégorie dans l'onglet Budgets pour suivre où part ton argent.</p></section>`;
  const items = rows.map(({ c, spent }) => {
    const p = c.budget > 0 ? spent / c.budget * 100 : null;
    let pill = '';
    if (p === null) pill = c.oneoff ? '<span class="pill">ponctuel</span>' : '<span class="pill warn">Hors budget</span>';
    else if (p >= 100) pill = `<span class="pill bad">${spent - c.budget < 0.5 ? 'Atteint' : '+' + eur0(spent - c.budget)}</span>`;
    else if (p >= 80) pill = `<span class="pill warn">${Math.round(p)} %</span>`;
    else pill = `<span class="pill">${Math.round(p)} %</span>`;
    return `<li class="cat" style="--c:var(--c${c.color})"><span class="sw"></span><div class="cat-main"><div class="cat-top"><span class="cat-name">${esc(catName(c))}</span><span class="cat-amt mono">${eur0(spent)}${c.budget > 0 ? ` <span class="muted">/ ${eur0(c.budget)}</span>` : ''}</span></div><div class="bar"><span style="width:${Math.min(100, p ?? 100).toFixed(1)}%"></span></div></div>${pill}</li>`;
  }).join('');
  const assigned = st.cats.reduce((a, c) => a + c.budget, 0);
  const left = s.available - assigned;
  const note = s.base > 0 && assigned > 0 && Math.abs(left) >= 1 ? `<p class="foot-note">${left > 0 ? `${eur0(left)} de ton budget ne sont rangés dans aucune catégorie.` : `Tes budgets par catégorie dépassent de ${eur0(-left)} ce dont tu disposes.`}</p>` : '';
  return `<section class="card"><h2>Catégories <small>dépensé / budget</small></h2><ul class="cats">${items}</ul>${note}</section>`;
}

function txRow(t, st) {
  const isIn = t.kind === 'in', isSave = t.kind === 'save', isFix = t.kind === 'fixed';
  const c = isIn ? { name: 'Revenu', color: 3 } : isSave ? { name: 'Épargne', color: 1 } : isFix ? { name: 'Charge fixe', color: 9 } : catOf(t.cat, st);
  const initial = (t.label || c.name || '?').trim().charAt(0).toUpperCase() || '?';
  let meta;
  if (isIn) { const source = t.inc ? st.incomes.find(i => i.id === t.inc) : null; meta = [source ? `Revenu · ${source.name || 'versement prévu'}` : 'Revenu en plus']; }
  else if (isSave) { const pot = t.sav ? st.savings.find(a => a.id === t.sav) : null; meta = [`Épargne · ${pot ? pot.name || 'compte' : 'autre compte'}`]; }
  else if (isFix) { const bill = t.fix ? st.fixed.find(f => f.id === t.fix) : null; meta = [`Charge fixe · ${bill ? bill.name || 'sans nom' : 'supprimée'}`]; }
  else meta = [catName(c)];
  if (t.src === 'notif') meta.push('notif');
  const fallback = isIn ? 'Revenu' : isSave ? 'Épargne' : isFix ? 'Charge fixe' : 'Dépense';
  return `<button class="tx" type="button" data-tx="${esc(t.id)}" data-ym="${esc(t.ym)}" style="--c:var(--c${c.color})"><span class="tx-ico" aria-hidden="true">${esc(initial)}</span><span class="tx-main"><span class="tx-label">${esc(t.label || fallback)}</span><span class="tx-meta">${esc(meta.join(' · '))}</span></span><span class="tx-amt mono${isIn ? ' in' : isSave ? ' save' : ''}">${isIn ? '+' : isSave ? '' : '−'}${eur(t.amount)}</span></button>`;
}

function recentHTML(s) {
  const st = cur().settings;
  const list = s.txs.slice().sort(byNewest).slice(0, 5);
  const body = list.length ? `<div class="txs">${list.map(t => txRow(t, st)).join('')}</div>` : `<p class="empty">Aucune opération ce mois-ci. Touche <b>+</b> pour en ajouter une.</p>`;
  return `<section class="card"><h2>Dernières opérations ${list.length ? '<button class="btn ghost small" type="button" data-go="operations">Tout voir</button>' : ''}</h2>${body}</section>`;
}

function historyData() {
  const out = [];
  const st = cur().settings;
  const ids = new Set(st.cats.filter(c => c.oneoff).map(c => c.id));
  for (let k = 5; k >= 0; k--) {
    const ym = ymShift(S.ym, -k);
    const o = txOf(ym).filter(t => t.kind === 'out');
    out.push({ ym, spent: sum(o), oneoff: sum(o.filter(t => ids.has(catOf(t.cat, st).id))) });
  }
  return out;
}

function renderMois() {
  const el = $('#v-mois');
  if (!S.loaded) { el.innerHTML = monthNav() + '<section class="card empty">Chargement de tes comptes…</section>'; return; }
  const s = stats(S.ym);
  const parts = [monthNav()];
  if (!S.demo && !real.hasData) parts.push(welcomeHTML());
  parts.push(heroHTML(s));
  if (s.base > 0 && s.available - s.oneoff > 0 && !s.isFuture) parts.push(`<section class="card"><h2>Rythme du mois <small>dépenses cumulées</small></h2><div class="chart" id="pace-chart"></div><div class="legend"><span><i></i>Tes dépenses</span><span><i class="dash"></i>Rythme qui tient le budget</span>${s.oneoff ? `<span>Hors dépenses exceptionnelles (${esc(eur0(s.oneoff))})</span>` : ''}</div></section>`);
  parts.push(planHTML(s));
  parts.push(catsHTML(s));
  parts.push(recentHTML(s));
  if (historyData().filter(h => h.spent > 0).length >= 2) parts.push(`<section class="card"><h2>Six derniers mois <small>dépenses variables</small></h2><div class="chart" id="hist-chart"></div></section>`);
  if (caps.sample && (s.spent > 0 || s.base > 0)) {
    const adv = S.advice && S.advice.ym === S.ym ? S.advice : null;
    parts.push(`<section class="card"><h2>Bilan avec Claude</h2><p class="muted">Claude lit les chiffres de ce mois (totaux, catégories, principaux commerçants) et te propose quatre pistes concrètes.</p>
      <button class="btn" type="button" data-act="advice" ${adv && adv.busy ? 'disabled' : ''}>${adv && adv.busy ? 'Analyse en cours…' : adv && adv.text ? 'Relancer l’analyse' : 'Analyser mon mois'}</button>
      ${adv && adv.err ? `<p class="err" style="margin-top:10px">${esc(adv.err)}</p>` : ''}<div class="advice-out" id="advice-out">${adv ? esc(adv.text) : ''}</div></section>`);
  }
  el.innerHTML = parts.join('');
  drawHero(); drawPace(s); drawHistory(s);
}

function renderOps() {
  const el = $('#v-operations');
  const st = cur().settings;
  if (!S.loaded) { el.innerHTML = monthNav() + '<section class="card empty">Chargement de tes comptes…</section>'; return; }
  const s = stats(S.ym);
  const chips = [`<button class="chip" type="button" data-filter="all" aria-pressed="${S.filter === 'all'}">Tout</button>`]
    .concat(st.cats.filter(c => s.byCat[c.id]).map(c => `<button class="chip" type="button" data-filter="${esc(c.id)}" aria-pressed="${S.filter === c.id}" style="--c:var(--c${c.color})"><i></i>${esc(catName(c))}</button>`));
  if (s.inc.length) chips.push(`<button class="chip" type="button" data-filter="in" aria-pressed="${S.filter === 'in'}" style="--c:var(--c3)"><i></i>Revenus</button>`);
  if (s.saves.length) chips.push(`<button class="chip" type="button" data-filter="save" aria-pressed="${S.filter === 'save'}" style="--c:var(--c1)"><i></i>Épargne</button>`);
  if (s.fixedTx.length) chips.push(`<button class="chip" type="button" data-filter="fixed" aria-pressed="${S.filter === 'fixed'}" style="--c:var(--c9)"><i></i>Charges fixes</button>`);
  el.innerHTML = `${monthNav()}
    <div class="totals"><span>Dépenses <b>${eur(s.spent)}</b></span>${s.inc.length ? `<span>Revenus reçus <b>+${eur(sum(s.inc))}</b></span>` : ''}${s.saves.length ? `<span>Mis de côté <b>${eur(sum(s.saves))}</b></span>` : ''}<span>${plural(s.txs.length, 'opération', 'opérations')}</span></div>
    <div class="search"><input id="ops-q" type="search" placeholder="Chercher un commerçant…" value="${esc(S.q)}" autocomplete="off" aria-label="Chercher une opération"></div>
    <div class="chips scroll" role="group" aria-label="Filtrer par catégorie">${chips.join('')}</div>
    <section class="card" id="ops-list"></section>`;
  renderOpsList();
}

function renderOpsList() {
  const box = $('#ops-list'); if (!box) return;
  const st = cur().settings;
  const s = stats(S.ym);
  const q = normKey(S.q);
  let list = s.txs.slice().sort(byNewest);
  if (S.filter === 'in' || S.filter === 'save' || S.filter === 'fixed') list = list.filter(t => t.kind === S.filter);
  else if (S.filter !== 'all') list = list.filter(t => t.kind === 'out' && catOf(t.cat, st).id === S.filter);
  if (q) list = list.filter(t => normKey(t.label + ' ' + catOf(t.cat, st).name).includes(q));
  if (!list.length) { box.innerHTML = `<p class="empty">${s.txs.length ? 'Aucune opération ne correspond.' : 'Aucune opération ce mois-ci. Touche <b>+</b> pour en ajouter une.'}</p>`; return; }
  let html = '', day = null;
  const dayTotals = {};
  for (const t of list) if (t.kind === 'out') dayTotals[t.date] = (dayTotals[t.date] || 0) + t.amount;
  for (const t of list) {
    if (t.date !== day) { day = t.date; html += `<div class="day-h"><span>${esc(dayLabel(day))}</span><span class="mono">${dayTotals[day] ? '−' + eur(dayTotals[day]) : ''}</span></div>`; }
    html += txRow(t, st);
  }
  const fx = s.bills.filter(b => b.amount > 0 && !b.done);
  const fixedNote = fx.length && S.filter === 'all' && !q ? `<p class="foot-note">Charges fixes pas encore marquées payées (déjà déduites de ton budget) : ${esc(fx.map(f => `${f.name || 'Sans nom'} ${eur0(f.amount)}`).join(', '))}.</p>` : '';
  box.innerHTML = `<div class="txs">${html}</div>${fixedNote}`;
}

const fmtIn = n => (n ? (Number.isInteger(round2(n)) ? String(round2(n)) : round2(n).toFixed(2).replace('.', ',')) : '');

function renderBudgets(fromSnap) {
  const el = $('#v-budgets');
  if (!S.loaded) { el.innerHTML = '<section class="card empty">Chargement de tes comptes…</section>'; return; }
  if (fromSnap && el.querySelector('#b-incsum') && el.contains(document.activeElement)) { updateBudgetSummary(); return; }
  const st = cur().settings;
  const savRows = st.savings.map(a => `<div class="edit-row nofix"><input id="sv-n-${esc(a.id)}" data-sav="${esc(a.id)}" data-f="name" value="${esc(a.name)}" maxlength="40" placeholder="Ex. : Livret A" aria-label="Nom du compte d’épargne"><div class="money"><input id="sv-a-${esc(a.id)}" data-sav="${esc(a.id)}" data-f="amount" inputmode="decimal" value="${fmtIn(a.amount)}" placeholder="0" aria-label="Montant épargné chaque mois"></div><button class="x-btn" type="button" data-act="del-sav" data-id="${esc(a.id)}" aria-label="Retirer ce compte">×</button></div>`).join('');
  const incRows =st.incomes.map(i => `<div class="edit-row inc"><input id="in-n-${esc(i.id)}" data-income="${esc(i.id)}" data-f="name" value="${esc(i.name)}" maxlength="40" placeholder="Ex. : Acompte" aria-label="Nom du versement"><div class="money"><input id="in-a-${esc(i.id)}" data-income="${esc(i.id)}" data-f="amount" inputmode="decimal" value="${fmtIn(i.amount)}" placeholder="0" aria-label="Montant net prévu"></div><input class="day-in" id="in-d-${esc(i.id)}" data-income="${esc(i.id)}" data-f="day" inputmode="numeric" maxlength="2" value="${i.day || ''}" placeholder="—" aria-label="Jour du versement dans le mois"><button class="x-btn" type="button" data-act="del-income" data-id="${esc(i.id)}" aria-label="Retirer ce versement">×</button></div>`).join('');
  const fixedRows = st.fixed.map(f => `<div class="edit-row nofix"><input id="fx-n-${esc(f.id)}" data-fixed="${esc(f.id)}" data-f="name" value="${esc(f.name)}" placeholder="Ex. : Loyer" aria-label="Nom de la charge"><div class="money"><input id="fx-a-${esc(f.id)}" data-fixed="${esc(f.id)}" data-f="amount" inputmode="decimal" value="${fmtIn(f.amount)}" placeholder="0" aria-label="Montant mensuel"></div><button class="x-btn" type="button" data-act="del-fixed" data-id="${esc(f.id)}" aria-label="Retirer cette charge">×</button></div>`).join('');
  const catRows = st.cats.map(c => `<div class="edit-row" style="--c:var(--c${c.color})"><span class="sw"></span><input id="ct-n-${esc(c.id)}" data-cat="${esc(c.id)}" data-f="name" value="${esc(c.name)}" maxlength="40" aria-label="Nom de la catégorie"><div class="money"><input id="ct-b-${esc(c.id)}" data-cat="${esc(c.id)}" data-f="budget" inputmode="decimal" value="${fmtIn(c.budget)}" placeholder="0" aria-label="Budget mensuel ${esc(c.name)}"></div><button class="x-btn" type="button" data-act="del-cat" data-id="${esc(c.id)}" aria-label="Supprimer la catégorie" ${c.id === 'autre' ? 'disabled' : ''}>×</button></div>`).join('');
  const modeTxt = S.demo ? "Mode exemple : rien n'est enregistré." : S.store === 'cloud' ? 'Tes données sont liées à ton compte Claude et synchronisées entre ton téléphone et ton ordinateur. Personne d’autre ne peut les lire, même si tu partages cette page.' : 'Tes données sont enregistrées dans ce navigateur uniquement. Elles disparaissent si tu effaces les données du site.';
  const memCount = Object.keys(st.memory).length;
  el.innerHTML = `
    <section class="card"><h2>Tes revenus <small>versés chaque mois</small></h2>
      <p class="hint">Ajoute chaque versement à part, par exemple ton acompte et ton solde, avec le jour où il arrive. Quand tu colles la notification du virement, le montant réellement reçu remplace le montant prévu pour ce mois.</p>
      ${incRows ? `<div class="edit-head" aria-hidden="true"><span>Versement</span><span>Net prévu</span><span>Jour</span><span></span></div><div class="edit-list">${incRows}</div>` : ''}
      <div class="row" style="margin-top:${incRows ? '0' : '12px'}">${st.incomes.length ? '' : '<button class="btn small primary" type="button" data-act="preset-pay">J’ai un acompte et un solde</button>'}<button class="btn small" type="button" data-act="add-income">+ Ajouter un versement</button></div>
      <div class="sum-line"><span class="muted">Total prévu par mois</span><b id="b-incsum"></b></div>
    </section>
    <section class="card"><h2>Ton épargne <small>mise de côté chaque mois</small></h2>
      <p class="hint">Un compte par ligne. Ces montants sont retirés de ton budget dès le début du mois, pour que tu ne les dépenses pas.</p>
      <div class="edit-list" style="margin-top:10px">${savRows || '<p class="muted" style="margin:0">Aucun compte d’épargne pour l’instant.</p>'}</div>
      <button class="btn small" type="button" data-act="add-sav">+ Ajouter un compte</button>
      <div class="sum-line"><span class="muted">Total épargné par mois</span><b id="b-savsum"></b></div>
      <p class="hint" id="b-savehint" style="margin-top:8px"></p>
    </section>
    <section class="card"><h2>Charges fixes <small>prélevées chaque mois</small></h2>
      <p class="hint">Loyer, voiture, forfait, assurances, crédit… Elles sont déduites de ton budget dès le début du mois. Quand l’une est prélevée, marque-la payée dans l’écran <b>Mois</b>.</p>
      <div class="edit-list" style="margin-top:10px">${fixedRows || '<p class="muted" style="margin:0">Aucune charge fixe pour l’instant.</p>'}</div>
      <button class="btn small" type="button" data-act="add-fixed">+ Ajouter une charge</button>

function updateBudgetSummary() {
  const st = cur().settings;
  const income = st.incomes.reduce((a, i) => a + i.amount, 0);
  const fixed = st.fixed.reduce((a, f) => a + f.amount, 0);
  const saving = st.savings.reduce((a, p) => a + p.amount, 0);
  const avail = income - fixed - saving;
  const assigned = st.cats.reduce((a, c) => a + c.budget, 0);
  const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
  set('b-incsum', eur(income));
  set('b-savsum', eur(saving));
  set('b-fixedsum', eur(fixed));
  set('b-avail', income > 0 ? eur0(avail) : '—');
  set('b-assigned', `${eur0(assigned)} sur ${income > 0 ? eur0(Math.max(0, avail)) : '—'}`);
  const bar = $('#b-assigned-bar');
  if (bar) bar.style.width = (avail > 0 ? Math.min(100, assigned / avail * 100) : 0).toFixed(1) + '%';
  const left = avail - assigned;
  set('b-assigned-hint', !(income > 0) ? 'Indique tes revenus pour calculer ce que tu peux répartir.' : left >= 1 ? `Il reste ${eur0(left)} à répartir.` : left <= -1 ? `Tu as réparti ${eur0(-left)} de trop : baisse un budget.` : 'Tout ton budget est réparti.');
  set('b-savehint', !(income > 0) ? 'Indique tes revenus pour voir quelle part tu mets de côté.'
    : saving > 0 ? `Tu mets de côté ${Math.round(saving / income * 100)} % de tes revenus, soit ${eur0(saving * 12)} par an.`
    : `Repère courant : mettre de côté 10 à 20 % des revenus, soit ${eur0(income * 0.1)} à ${eur0(income * 0.2)} par mois.`);
}

function drawHero() {
  const cv = $('#guilloche'); if (!cv) return;
  const box = cv.parentElement.getBoundingClientRect();
  const W = box.width, H = box.height; if (!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--hero-ink').trim() || '#fff';
  ctx.lineWidth = 0.7;
  ctx.globalAlpha = 0.11;
  for (let i = 0; i < 16; i++) {
    const ph = i * 0.36;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const t = x / W * Math.PI * 2;
      const y = H * 0.7 + Math.sin(t * 1.7 + ph) * H * 0.15 * Math.cos(t * 0.6 - ph * 0.55) + Math.sin(t * 9 + ph * 2.1) * H * 0.018;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 0.14;
  const cx = W - 58, cy = 54, R = 44;
  for (let j = 0; j < 7; j++) {
    ctx.beginPath();
    for (let k = 0; k <= 720; k++) {
      const t = k / 720 * Math.PI * 2;
      const r = R * (0.58 + j * 0.035 + 0.3 * Math.cos(11 * t + j * 0.28));
      const x = cx + r * Math.cos(t), y = cy + r * Math.sin(t);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawPace(s) {
  const box = $('#pace-chart'); if (!box) return;
  const W = Math.max(260, Math.round(box.clientWidth)), H = 160;
  const m = { l: 6, r: 58, t: 14, b: 26 };
  const dim = s.dim, last = s.dayIdx;
  const target = s.available - s.oneoff;
  const st = cur().settings;
  const daily = new Array(dim + 1).fill(0);
  for (const t of s.out) { if (s.oneoffIds.has(catOf(t.cat, st).id)) continue; const d = +t.date.slice(8, 10); if (d >= 1 && d <= dim) daily[d] += t.amount; }
  const cum = [0];
  for (let d = 1; d <= dim; d++) cum[d] = cum[d - 1] + daily[d];
  const peak = cum[last] || 0;
  const ymax = Math.max(target, peak, 1) * 1.08;
  const x = d => m.l + d / dim * (W - m.l - m.r);
  const y = v => H - m.b - v / ymax * (H - m.t - m.b);
  let g = '';
  g += `<line class="ch-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  g += `<line class="ch-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/>`;
  g += `<text class="ch-txt" x="${W - m.r + 6}" y="${(y(target) + 3.5).toFixed(1)}">${esc(eur0(target))}</text>`;
  g += `<text class="ch-txt" x="${W - m.r + 6}" y="${(y(0) + 3.5).toFixed(1)}">0 €</text>`;
  g += `<line class="ch-ideal" x1="${x(0)}" y1="${y(0)}" x2="${x(dim).toFixed(1)}" y2="${y(target).toFixed(1)}"/>`;
  if (last > 0) {
    let path = `M${x(0).toFixed(1)} ${y(0).toFixed(1)}`;
    for (let d = 1; d <= last; d++) path += ` L${x(d).toFixed(1)} ${y(cum[d]).toFixed(1)}`;
    g += `<path class="ch-area" d="${path} L${x(last).toFixed(1)} ${y(0).toFixed(1)} Z"/>`;
    g += `<path class="ch-line" d="${path}"/>`;
    g += `<circle class="ch-dot" cx="${x(last).toFixed(1)}" cy="${y(peak).toFixed(1)}" r="4.5"/>`;
    if (Math.abs(y(peak) - y(target)) > 14) g += `<text class="ch-val" x="${W - m.r + 6}" y="${(y(peak) + 3.5).toFixed(1)}">${esc(eur0(peak))}</text>`;
  }
  const ticks = [1, Math.round(dim / 3), Math.round(dim * 2 / 3), dim];
  for (const d of ticks) g += `<text class="ch-txt" x="${x(d).toFixed(1)}" y="${H - 8}" text-anchor="middle">${d}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Dépenses cumulées : ${esc(eur0(peak))} au jour ${last}, pour un budget de ${esc(eur0(target))}">${g}</svg>`;
}

function drawHistory(s) {
  const box = $('#hist-chart'); if (!box) return;
  const data = historyData();
  const W = Math.max(260, Math.round(box.clientWidth)), H = 170;
  const m = { l: 6, r: 6, t: 22, b: 24 };
  const avail = s.base > 0 ? s.available : 0;
  const ymax = Math.max(avail, ...data.map(d => d.spent), 1) * 1.1;
  const slot = (W - m.l - m.r) / data.length;
  const bw = Math.min(42, slot * 0.56);
  const y = v => H - m.b - v / ymax * (H - m.t - m.b);
  let g = `<line class="ch-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  if (avail > 0) g += `<line class="ch-ideal" x1="${m.l}" x2="${W - m.r}" y1="${y(avail).toFixed(1)}" y2="${y(avail).toFixed(1)}"/>`;
  data.forEach((d, i) => {

      if (d.oneoff > 0) g += `<rect class="ch-bar oneoff${isCur ? ' cur' : ''}" x="${(cx - bw / 2).toFixed(1)}" y="${y(d.spent).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(regular) - y(d.spent)).toFixed(1)}" rx="4"/>`;
      g += `<text class="ch-val" x="${cx.toFixed(1)}" y="${(y(d.spent) - 6).toFixed(1)}" text-anchor="middle">${esc(eur0(d.spent).replace(/\s?€/, ''))}</text>`;

}
