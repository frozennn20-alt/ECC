const sheet = { editing: null, kind: 'out', cat: 'autre', catTouched: false, inc: '', incTouched: false, sav: '', savTouched: false, fix: '', src: 'manuel', delArmed: false };

/* Relie un virement d'épargne à un compte : par son nom, puis par le montant
   le plus proche, puis au seul compte pas encore alimenté ce mois-ci. */
function guessSav(label, date, amount) {
  const st = cur().settings;
  if (!st.savings.length) return '';
  const k = ` ${normKey(label)} `;
  for (const a of st.savings) { const n = normKey(a.name); if (n.length >= 3 && k.includes(` ${n}`)) return a.id; }
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : todayISO();
  const done = new Set(txOf(iso.slice(0, 7)).filter(t => t.kind === 'save' && t.sav && !(sheet.editing && t.id === sheet.editing.id)).map(t => t.sav));
  const open = st.savings.filter(a => !done.has(a.id));
  const pool = open.length ? open : st.savings;
  if (amount > 0) {
    const close = pool.filter(a => a.amount > 0 && Math.abs(amount - a.amount) / a.amount <= 0.25).sort((a, b) => Math.abs(amount - a.amount) - Math.abs(amount - b.amount));
    if (close.length) return close[0].id;
  }
  return open.length === 1 ? open[0].id : '';
}
function renderSheetSavs() {
  const st = cur().settings;
  const chips = st.savings.map(a => `<button class="chip" type="button" data-sav="${esc(a.id)}" aria-pressed="${a.id === sheet.sav}" style="--c:var(--c1)"><i></i>${esc(a.name || 'Compte')}</button>`);
  chips.push(`<button class="chip" type="button" data-sav="" aria-pressed="${!sheet.sav}"><i></i>Autre épargne</button>`);
  $('#f-savs').innerHTML = chips.join('');
  const pot = st.savings.find(a => a.id === sheet.sav);
  $('#f-sav-hint').textContent = pot
    ? `Compte comme épargne, pas comme dépense. Remplace les ${eur0(pot.amount)} prévus pour « ${pot.name || 'ce compte'} » ce mois-ci.`
    : st.savings.length ? 'Compte comme épargne en plus de celle prévue, pas comme dépense.' : 'Compte comme épargne, pas comme dépense. Ajoute tes comptes dans Budgets pour suivre chacun.';
}
function refreshSavGuess() {
  if (sheet.kind !== 'save' || sheet.savTouched) return;
  sheet.sav = guessSav($('#f-label').value, $('#f-date').value, Math.abs(toNumber($('#f-amount').value)) || 0);
  renderSheetSavs();
}

/* Relie un revenu reçu à un versement prévu : par son nom, par les mots
   « salaire / paie / acompte », puis par le montant le plus proche. */
function guessInc(label, date, amount) {
  const st = cur().settings;
  if (!st.incomes.length) return '';
  const k = ` ${normKey(label)} `;
  for (const i of st.incomes) { const n = normKey(i.name); if (n.length >= 3 && k.includes(` ${n}`)) return i.id; }
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : todayISO();
  const got = new Set(txOf(iso.slice(0, 7)).filter(t => t.kind === 'in' && t.inc && !(sheet.editing && t.id === sheet.editing.id)).map(t => t.inc));
  const open = st.incomes.filter(i => !got.has(i.id));
  if (!open.length) return '';
  if (amount > 0) {
    const close = open.filter(i => i.amount > 0 && Math.abs(amount - i.amount) / i.amount <= 0.25).sort((a, b) => Math.abs(amount - a.amount) - Math.abs(amount - b.amount));
    if (close.length) return close[0].id;
  }
  if (/ (salaire|paie|remuneration|acompte|virement salaire) /.test(k)) {
    const d = +iso.slice(8, 10);
    return open.slice().sort((a, b) => Math.abs((a.day || d) - d) - Math.abs((b.day || d) - d))[0].id;
  }
  return '';
}
function renderSheetIncs() {
  const st = cur().settings;
  const chips = st.incomes.map(i => `<button class="chip" type="button" data-inc="${esc(i.id)}" aria-pressed="${i.id === sheet.inc}" style="--c:var(--c3)"><i></i>${esc(i.name || 'Versement')}</button>`);
  chips.push(`<button class="chip" type="button" data-inc="" aria-pressed="${!sheet.inc}"><i></i>Revenu en plus</button>`);
  $('#f-incs').innerHTML = chips.join('');
  const src = st.incomes.find(i => i.id === sheet.inc);
  $('#f-inc-hint').textContent = src
    ? `Le montant reçu remplace les ${eur0(src.amount)} prévus pour « ${src.name || 'ce versement'} » ce mois-ci.`
    : 'Compté en plus de tes revenus habituels : remboursement, prime, cadeau…';
}
function refreshIncGuess() {
  if (sheet.kind !== 'in' || sheet.incTouched) return;
  sheet.inc = guessInc($('#f-label').value, $('#f-date').value, Math.abs(toNumber($('#f-amount').value)) || 0);
  renderSheetIncs();
}

function openSheet(opts = {}) {
  const st = cur().settings;
  const t = opts.tx || null;
  const pre = opts.prefill || {};
  sheet.editing = t; sheet.delArmed = false;
  sheet.src = t ? t.src : (opts.src || 'manuel');
  sheet.catTouched = !!t;
  sheet.kind = t ? t.kind : (pre.kind || 'out');
  $('#f-amount').value = t ? fmtIn(t.amount) : pre.amount ? fmtIn(pre.amount) : '';
  $('#f-label').value = t ? t.label : (pre.label || '');
  $('#f-date').value = t ? t.date : (pre.date || todayISO());
  $('#f-notif').value = '';
  $('#f-parsed').hidden = true;
  $('#f-err').hidden = true;
  sheet.cat = t ? catOf(t.cat, st).id : guessCat(pre.label || '', st);
  sheet.incTouched = !!t;
  sheet.inc = t ? (t.inc || '') : sheet.kind === 'in' ? guessInc(pre.label || '', pre.date, pre.amount || 0) : '';
  sheet.savTouched = !!t;
  sheet.sav = t ? (t.sav || '') : pre.sav || (sheet.kind === 'save' ? guessSav(pre.label || '', pre.date, pre.amount || 0) : '');
  if (!t && pre.sav) sheet.savTouched = true;
  sheet.fix = t ? (t.fix || '') : (pre.fix || '');
  $('#sheet-title').textContent = t ? 'Modifier l’opération' : 'Nouvelle opération';
  const del = $('#f-delete'); del.hidden = !t; del.classList.remove('confirm'); del.textContent = 'Supprimer';
  $('#paste-box').hidden = !!t;
  renderSheetKind(); renderSheetCats(); checkFixedWarn();
  $('#scrim').hidden = false;
  document.body.classList.add('locked');
  if (opts.focusPaste) setTimeout(() => $('#f-notif').focus(), 80);
}
function closeSheet() { $('#scrim').hidden = true; document.body.classList.remove('locked'); sheet.editing = null; }

function renderSheetKind() {
  document.querySelectorAll('#f-kind button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === sheet.kind)));
  $('#f-cats-wrap').hidden = sheet.kind !== 'out';
  $('#f-inc-wrap').hidden = !(sheet.kind === 'in' && cur().settings.incomes.length);
  $('#f-sav-wrap').hidden = sheet.kind !== 'save';
  renderSheetIncs(); renderSheetSavs();
}
function renderSheetCats() {
  const st = cur().settings;
  $('#f-cats').innerHTML = st.cats.map(c => `<button class="chip" type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id === sheet.cat}" style="--c:var(--c${c.color})"><i></i>${esc(catName(c))}</button>`).join('');
}
function matchFixed(label) {
  const lbl = normKey(label);
  if (lbl.length < 3) return null;
  return cur().settings.fixed.find(f => { const n = normKey(f.name); return n.length >= 3 && (lbl.includes(n) || n.includes(lbl)); }) || null;
}
function checkFixedWarn() {
  const box = $('#f-fixedwarn');
  const st = cur().settings;
  if (sheet.kind === 'fixed') {
    const f = st.fixed.find(x => x.id === sheet.fix);
    box.hidden = false;
    box.innerHTML = `Paiement de ta charge fixe <b>« ${esc(f ? f.name || 'sans nom' : 'supprimée')} »</b> : elle sera marquée payée ce mois-ci, sans être comptée deux fois. <button class="btn ghost small" type="button" data-fixact="out">C’est une autre dépense</button>`;
    return;
  }
  const hit = sheet.kind === 'out' ? matchFixed($('#f-label').value) : null;
  box.hidden = !hit;
  if (hit) box.innerHTML = `Ça ressemble à ta charge fixe <b>« ${esc(hit.name)} »</b>, déjà déduite de ton budget. <button class="btn ghost small" type="button" data-fixact="${esc(hit.id)}">Oui, c’est ce paiement</button>`;
}

function onPasteInput() {
  const raw = $('#f-notif').value;
  const out = $('#f-parsed');
  const p = parseNotif(raw);
  if (!p) { out.hidden = true; return; }
  const st = cur().settings;
  sheet.src = 'notif';
  if (p.amount) $('#f-amount').value = fmtIn(p.amount);
  if (p.label) $('#f-label').value = p.label;
  $('#f-date').value = p.date;
  sheet.kind = p.kind;
  if (p.kind === 'out') { const f = matchFixed(p.label); if (f) { sheet.kind = 'fixed'; sheet.fix = f.id; } }
  if (!sheet.catTouched) sheet.cat = guessCat(p.label, st);
  if (p.kind === 'in' && !sheet.incTouched) sheet.inc = guessInc(p.label, p.date, p.amount || 0);
  if (p.kind === 'save' && !sheet.savTouched) sheet.sav = guessSav(p.label, p.date, p.amount || 0);
  renderSheetKind(); renderSheetCats(); checkFixedWarn();
  out.hidden = false;
  const srcName = (st.incomes.find(i => i.id === sheet.inc) || {}).name;
  const potName = (st.savings.find(a => a.id === sheet.sav) || {}).name;
  const billName = (st.fixed.find(f => f.id === sheet.fix) || {}).name;
  const what = sheet.kind === 'fixed' ? ` · charge fixe (${billName || 'payée'})` : p.kind === 'in' ?` · revenu${srcName ? ' (' + srcName + ')' : ''}` : p.kind === 'save' ? ` · épargne${potName ? ' (' + potName + ')' : ''}` : ' · ' + catName(catOf(sheet.cat, st));
  if (p.amount) { out.className = 'parsed'; out.textContent = `Lu : ${eur(p.amount)}${p.label ? ' · ' + p.label : ''}${what}`; }
  else { out.className = 'parsed miss'; out.textContent = 'Pas de montant trouvé dans ce texte. Saisis-le ci-dessous.'; }
}

function remember(label, cat) {
  const k = memKey(label);
  if (!k || cat === 'revenu') return;
  const st = cur().settings;
  if (st.memory[k] === cat) return;
  if (!st.memory[k] && guessCat(label, { cats: st.cats, memory: {} }) === cat) return;
  const next = clone(st);
  next.memory[k] = cat;
  const keys = Object.keys(next.memory);
  if (keys.length > 400) delete next.memory[keys[0]];
  saveSettings(next, true);
}

async function submitSheet(e) {
  e.preventDefault();
  const err = $('#f-err');
  const amount = round2(Math.abs(toNumber($('#f-amount').value)));
  if (!(amount > 0)) { err.textContent = 'Indique un montant supérieur à 0.'; err.hidden = false; $('#f-amount').focus(); return; }
  const date = /^\d{4}-\d{2}-\d{2}$/.test($('#f-date').value) ? $('#f-date').value : todayISO();
  const st = cur().settings;
  const fixId = sheet.kind === 'fixed' && st.fixed.some(f => f.id === sheet.fix) ? sheet.fix : '';
  const kind = sheet.kind === 'fixed' && !fixId ? 'out' : sheet.kind;
  const bill = st.fixed.find(f => f.id === fixId);
  const savId = kind === 'save' && st.savings.some(a => a.id === sheet.sav) ? sheet.sav : '';
  const pot = st.savings.find(a => a.id === savId);
  const label = ($('#f-label').value.trim() || (kind === 'in' ? 'Revenu' : kind === 'save' ? (pot && pot.name) || 'Épargne' : kind === 'fixed' ? (bill && bill.name) || 'Charge fixe' : 'Dépense')).slice(0, 60);
  const cat = kind === 'in' ? 'revenu' : kind === 'save' ? 'epargne' : kind === 'fixed' ? 'fixe' : catOf(sheet.cat, st).id;
  const old = sheet.editing;
  const id = old ? old.id : rid('t');
  const ym = date.slice(0, 7);
  const incId = kind === 'in' && st.incomes.some(i => i.id === sheet.inc) ? sheet.inc : '';
  const tx = { amount, kind, label, cat, date, src: sheet.src, created: old && old.created ? old.created : Date.now(), inc: incId, sav: savId, fix: kind === 'fixed' ? fixId : '' };

  const incSrc = st.incomes.find(i => i.id === incId);
  let msg = old ? 'Opération modifiée'
    : kind === 'in' ? (incSrc ? `${incSrc.name || 'Versement'} de ${eur(amount)} reçu : budget du mois mis à jour` : `Revenu de ${eur(amount)} ajouté`)
    : kind === 'save' ? `${eur(amount)} mis de côté${pot ? ' sur « ' + (pot.name || 'ton compte') + ' »' : ''}`
    : kind === 'fixed' ? `« ${(bill && bill.name) || 'Charge fixe'} » marquée payée (${eur(amount)})`
    : `Dépense de ${eur(amount)} ajoutée`;
  let tone = '';
  if (kind === 'out') {
    const c = catOf(cat, st);
    const before = txOf(ym).filter(t => t.kind === 'out' && catOf(t.cat, st).id === c.id && t.id !== id).reduce((a, t) => a + t.amount, 0);
    const after = before + amount;
    if (c.budget > 0) {
      const p = after / c.budget * 100;
      if (p >= 100) { msg = `${catName(c)} : budget dépassé de ${eur0(after - c.budget)}`; tone = 'bad'; }
      else if (p >= 80) { msg = `${catName(c)} : ${Math.round(p)} % du budget utilisé, il reste ${eur0(c.budget - after)}`; tone = 'warn'; }
      else if (!old) msg += ` · ${catName(c)} ${Math.round(p)} %`;
    }
  }
  closeSheet();
  if (!S.demo && S.store === 'loading') toast('Enregistrement dès que tes données sont chargées…');
  try {
    if (old && old.ym !== ym) await delTx(old.ym, old.id);
    await putTx(ym, id, tx);
    if (kind === 'out') remember(label, cat);
    toast(msg, tone);
    if (ym !== S.ym && !old) { S.ym = ym; render(); }
  } catch (ex) { toast(writeError(ex), 'bad'); }
}

async function deleteFromSheet() {
  const btn = $('#f-delete');
  if (!sheet.delArmed) { sheet.delArmed = true; btn.classList.add('confirm'); btn.textContent = 'Confirmer la suppression'; return; }
  const t = sheet.editing;
  closeSheet();
  if (!t) return;
  try { await delTx(t.ym, t.id); toast('Opération supprimée'); } catch (ex) { toast(writeError(ex), 'bad'); }
}

/* ---------- misc actions ---------- */
let toastTimer = null;
function toast(text, tone) {
  const el = $('#toast');
  el.className = 'toast' + (tone ? ' ' + tone : '');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, tone ? 5200 : 3200);
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copié'; setTimeout(() => { btn.textContent = 'Copier'; }, 1600); }
  catch (e) {
    const code = btn.parentElement.querySelector('code');
    if (code) { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('Lien sélectionné : copie-le avec ton menu habituel.');
  }
}

async function exportCSV() {
  if (!caps.downloads) return;
  const st = cur().settings;
  const all = Object.keys(cur().months).sort().flatMap(ym => txOf(ym)).sort((a, b) => a.date.localeCompare(b.date));
  if (!all.length) { toast('Aucune opération à exporter pour l’instant.'); return; }
  const safe = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date', 'Type', 'Libellé', 'Catégorie', 'Montant (€)', 'Source'].join(';')];
  const typeOf = t => (t.kind === 'in' ? 'Revenu' : t.kind === 'save' ? 'Épargne' : t.kind === 'fixed' ? 'Charge fixe' : 'Dépense');
  const groupOf = t => {
    if (t.kind === 'fixed') return (st.fixed.find(f => f.id === t.fix) || { name: 'Charge fixe' }).name || 'Charge fixe';
    if (t.kind === 'in') return (st.incomes.find(i => i.id === t.inc) || { name: 'Revenu en plus' }).name || 'Revenu';
    if (t.kind === 'save') return (st.savings.find(a => a.id === t.sav) || { name: 'Autre épargne' }).name || 'Épargne';
    return catName(catOf(t.cat, st));
  };
  for (const t of all) rows.push([t.date, typeOf(t), safe(t.label), safe(groupOf(t)), (t.kind === 'in' ? '' : '-') + t.amount.toFixed(2).replace('.', ','), t.src === 'notif' ? 'Notification' : 'Manuel'].join(';'));
  try { await caps.downloads.save({ filename: `pecule-${todayISO()}.csv`, data: '﻿' + rows.join('\r\n') }); toast('Export prêt'); }
  catch (e) { if (e && e.code === 'declined') return; toast('L’export n’a pas pu se faire ici.', 'bad'); }
}

async function askAdvice() {
  if (!caps.sample) return;
  const s = stats(S.ym), st = cur().settings;
  const merchants = {};
  for (const t of s.out) merchants[t.label] = (merchants[t.label] || 0) + t.amount;
  const top = Object.entries(merchants).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([nom, total]) => ({ nom, total: round2(total) }));
  const data = {
    mois: ymLabel(S.ym), avancement: s.isCurrent ? `jour ${s.dayIdx} sur ${s.dim}` : s.isPast ? 'mois terminé' : 'mois à venir',
    versements: s.sources.map(x => ({ nom: x.name, prevu: x.amount, recu: x.received ? round2(x.actual) : null, jour: x.day || null })), revenus_en_plus: round2(s.extra), charges_fixes: s.bills.map(b => ({ nom: b.name, prevu: b.amount, paye: b.done ? round2(b.actual) : null })), total_charges_fixes: round2(s.fixed), epargne: s.pots.map(p => ({ compte: p.name, prevu: p.amount, verse: p.done ? round2(p.actual) : null })), epargne_totale: round2(s.saving),
    disponible_pour_depenses: round2(s.available), depense: round2(s.spent), reste: round2(s.remaining),
    categories: st.cats.map(c => ({ nom: c.name, budget: c.budget, depense: round2(s.byCat[c.id] || 0), ponctuel: !!c.oneoff })).filter(c => c.budget || c.depense),
    principaux_commercants: top,
  };
  const prompt = `Tu aides une personne à mieux gérer son argent. Réponds en français en la tutoyant, avec exactement 4 puces courtes (une ou deux phrases chacune, chaque puce commence par « • »), sans titre ni formule de politesse, avec des montants précis en euros. Ne donne aucun conseil d'investissement financier précis.

Données du mois (JSON) :
${JSON.stringify(data)}

Puces attendues : 1) le constat du mois en une phrase, 2) la catégorie à surveiller et un montant cible réaliste, 3) une action concrète pour les jours qui restent (ou pour le mois suivant si le mois est terminé), 4) une idée pour épargner davantage le mois prochain.`;
  S.advice = { ym: S.ym, text: '', busy: true, err: '' };
  render();
  try {
    const r = await caps.sample(prompt, { onText: ({ text }) => { S.advice.text = text; const o = $('#advice-out'); if (o) o.textContent = text; } });
    S.advice.text = r.text;
  } catch (e) {
    const code = e && e.code;
    S.advice.err = code === 'not_granted' ? 'Tu as refusé que cette page interroge Claude. Tu peux changer ça dans le menu Autorisations de la page.' : code === 'rate_limited' ? 'Trop de demandes d’affilée : réessaie dans quelques minutes.' : 'Claude n’a pas pu répondre cette fois. Réessaie plus tard.';
  }
  S.advice.busy = false;
  render();
}

function suggestBudgets() {
  const st = clone(cur().settings);
  const fixed = st.fixed.reduce((a, f) => a + f.amount, 0);
  const avail = st.incomes.reduce((a, i) => a + i.amount, 0) - fixed - st.savings.reduce((a, p) => a + p.amount, 0);
  if (!(avail > 0)) { toast('Indique d’abord des revenus supérieurs à tes charges fixes et à ton épargne.', 'warn'); return; }
  const shares = Object.fromEntries(DEFAULT_CATS.map(c => [c.id, c.share]));
  const known = st.cats.filter(c => shares[c.id]);
  const total = known.reduce((a, c) => a + shares[c.id], 0) || 1;
  for (const c of st.cats) c.budget = shares[c.id] ? Math.floor(avail * shares[c.id] / total / 5) * 5 : 0;
  saveSettings(st, true);
  renderBudgets();
  toast('Répartition proposée : ajuste chaque montant à ta vie.');
}

function editSettings(fn) { const next = clone(cur().settings); fn(next); saveSettings(next); return next; }

/* ---------- routing & events ---------- */
const VIEWS = ['mois', 'operations', 'budgets', 'notifs'];
function setHash(v) { try { history.replaceState(null, '', '#' + v); } catch (e) { /* adresse non modifiable ici */ } }
function slugToLabel(slug) { return slug.split('-').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ').slice(0, 40); }

function handleRoute() {
  let h = '';
  try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { h = ''; }
  const d = /^d-(\d{1,9})(?:-([a-z0-9-]*))?$/i.exec(h);
  if (d) {
    const label = slugToLabel((d[2] || '').toLowerCase());
    S.view = 'mois'; setHash('mois');
    openSheet({ prefill: { amount: +d[1] / 100, label, kind: 'out' }, src: 'notif' });
    return;
  }
  if (h === 'ajout') { S.view = 'mois'; setHash('mois'); openSheet({ focusPaste: true, src: 'notif' }); return; }
  if (VIEWS.includes(h)) S.view = h;
}
function handleQuery() {
  try {
    const q = new URLSearchParams(location.search);
    const notif = q.get('notif');
    const montant = q.get('montant');
    if (notif) { openSheet({ src: 'notif', focusPaste: false }); $('#f-notif').value = notif.slice(0, 500); onPasteInput(); }
    else if (montant) openSheet({ src: 'notif', prefill: { amount: Math.abs(toNumber(montant)) || 0, label: (q.get('marchand') || '').slice(0, 40), kind: 'out' } });
  } catch (e) { /* pas de paramètres */ }
}

function go(view) { S.view = view; setHash(view); render(); window.scrollTo(0, 0); }

function bind() {
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  $('#fab').addEventListener('click', () => openSheet({}));
  window.addEventListener('hashchange', () => { handleRoute(); render(); });

  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-go]');
    if (!t || $('#scrim').contains(t)) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.tx) { const tx = txOf(t.dataset.ym).find(x => x.id === t.dataset.tx); if (tx) openSheet({ tx }); return; }
    if (t.dataset.filter) { S.filter = t.dataset.filter; renderOps(); return; }
    if (t.dataset.platform) { S.platform = t.dataset.platform; renderNotifs(); return; }
    if (t.dataset.copy) { copyText(t.dataset.copy, t); return; }
    if (t.dataset.sample) { S.test = t.dataset.sample; const ta = $('#t-paste'); if (ta) ta.value = S.test; renderTest(); return; }
    const act = t.dataset.act;
    if (!act) return;
    if (act === 'prev' || act === 'next') { S.ym = ymShift(S.ym, act === 'prev' ? -1 : 1); S.filter = 'all'; render(); }
    else if (act === 'demo-on') { demo = makeDemo(); S.demo = true; S.ym = curYM(); go('mois'); }
    else if (act === 'demo-off') { S.demo = false; demo = null; S.advice = null; go('mois'); }
    else if (act === 'advice') askAdvice();
    else if (act === 'export') exportCSV();
    else if (act === 'suggest') suggestBudgets();
    else if (act === 'forget') { editSettings(s => { s.memory = {}; }); renderBudgets(); toast('Commerçants oubliés'); }
    else if (act === 'preset-pay') {
      const a = rid('i'), b = rid('i');
      editSettings(s => { s.incomes.push({ id: a, name: 'Acompte', amount: 0, day: 15 }, { id: b, name: 'Solde', amount: 0, day: 30 }); });
      renderBudgets(); const n = document.getElementById('in-a-' + a); if (n) n.focus();
    }
    else if (act === 'mark') {
      const type = t.dataset.type, id = t.dataset.id;
      const st = cur().settings;
      const item = (type === 'fixed' ? st.fixed : st.savings).find(x => x.id === id);
      if (!item) return;
      const kind = type === 'fixed' ? 'fixed' : 'save';
      const ym = S.ym;
      const date = ym === curYM() ? todayISO() : `${ym}-${pad(daysIn(ym))}`;
      const name = item.name || (kind === 'fixed' ? 'Charge fixe' : 'Épargne');
      if (!(item.amount > 0)) { openSheet({ prefill: { kind, label: name, date, fix: kind === 'fixed' ? id : '', sav: kind === 'save' ? id : '' } }); return; }
      t.disabled = true;
      const tx = { amount: item.amount, kind, label: name, cat: kind === 'fixed' ? 'fixe' : 'epargne', date, src: 'manuel', created: Date.now(), inc: '', sav: kind === 'save' ? id : '', fix: kind === 'fixed' ? id : '' };
      putTx(ym, rid('t'), tx)
        .then(() => toast(`« ${name} » marqué ${kind === 'fixed' ? 'payé' : 'versé'} : ${eur(item.amount)}. Touche-le pour changer le montant ou annuler.`))
        .catch(ex => { t.disabled = false; toast(writeError(ex), 'bad'); });
    }
    else if (act === 'add-sav') { const id = rid('s'); editSettings(s => { s.savings.push({ id, name: '', amount: 0 }); }); renderBudgets(); const n = document.getElementById('sv-n-' + id); if (n) n.focus(); }
    else if (act === 'del-sav') { editSettings(s => { s.savings = s.savings.filter(a => a.id !== t.dataset.id); }); renderBudgets(); }
    else if (act === 'add-income') { const id = rid('i'); editSettings(s => { s.incomes.push({ id, name: '', amount: 0, day: 0 }); }); renderBudgets(); const n = document.getElementById('in-n-' + id); if (n) n.focus(); }
    else if (act === 'del-income') { editSettings(s => { s.incomes = s.incomes.filter(i => i.id !== t.dataset.id); }); renderBudgets(); }
    else if (act === 'add-fixed') { const id = rid('f'); editSettings(s => { s.fixed.push({ id, name: '', amount: 0 }); }); renderBudgets(); const n = document.getElementById('fx-n-' + id); if (n) n.focus(); }
    else if (act === 'del-fixed') { editSettings(s => { s.fixed = s.fixed.filter(f => f.id !== t.dataset.id); }); renderBudgets(); }
    else if (act === 'add-cat') {
      const id = rid('c');
      editSettings(s => { const used = new Set(s.cats.map(c => c.color)); let color = 1; while (used.has(color) && color < 10) color++; s.cats.splice(Math.max(0, s.cats.length - 1), 0, { id, name: 'Nouvelle catégorie', color, budget: 0 }); });
      renderBudgets(); const n = document.getElementById('ct-n-' + id); if (n) { n.focus(); n.select(); }
    }
    else if (act === 'del-cat') {
      if (!t.classList.contains('confirm')) { t.classList.add('confirm'); t.textContent = 'Sûr ?'; setTimeout(() => { if (t.isConnected) { t.classList.remove('confirm'); t.textContent = '×'; } }, 3000); return; }
      editSettings(s => { s.cats = s.cats.filter(c => c.id !== t.dataset.id); });
      renderBudgets(); toast('Catégorie supprimée : ses dépenses passent dans « Autre ».');
    }
    else if (act === 'test-add') { const p = parseNotif(S.test); if (p) openSheet({ src: 'notif', prefill: { amount: p.amount, label: p.label, kind: p.kind, date: p.date } }); }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'ops-q') { S.q = t.value; renderOpsList(); return; }
    if (t.id === 't-paste') { S.test = t.value; renderTest(); return; }
    if (!$('#v-budgets').contains(t)) return;
    if (t.dataset.sav) {
      const id = t.dataset.sav;
      editSettings(s => { const a = s.savings.find(x => x.id === id); if (a) { if (t.dataset.f === 'name') a.name = t.value.slice(0, 40); else a.amount = Math.max(0, toNumber(t.value) || 0); } });
      updateBudgetSummary(); return;
    }
    if (t.dataset.income) {
      const id = t.dataset.income;
      editSettings(s => {
        const i = s.incomes.find(x => x.id === id);
        if (!i) return;
        if (t.dataset.f === 'name') i.name = t.value.slice(0, 40);
        else if (t.dataset.f === 'day') { const d = parseInt(t.value, 10); i.day = d >= 1 && d <= 31 ? d : 0; }
        else i.amount = Math.max(0, toNumber(t.value) || 0);
      });
      updateBudgetSummary(); return;
    }
    if (t.dataset.fixed) { const id = t.dataset.fixed; editSettings(s => { const f = s.fixed.find(x => x.id === id); if (f) { if (t.dataset.f === 'name') f.name = t.value.slice(0, 40); else f.amount = Math.max(0, toNumber(t.value) || 0); } }); updateBudgetSummary(); return; }
    if (t.dataset.cat) { const id = t.dataset.cat; editSettings(s => { const c = s.cats.find(x => x.id === id); if (c) { if (t.dataset.f === 'name') c.name = t.value.slice(0, 40); else c.budget = Math.max(0, toNumber(t.value) || 0); } }); updateBudgetSummary(); }
  });

  /* sheet */
  $('#sheet').addEventListener('submit', submitSheet);
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#f-delete').addEventListener('click', deleteFromSheet);
  $('#scrim').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
  $('#f-notif').addEventListener('input', onPasteInput);
  $('#f-label').addEventListener('input', () => {
    if (!sheet.catTouched && sheet.kind === 'out') { sheet.cat = guessCat($('#f-label').value, cur().settings); renderSheetCats(); }
    refreshIncGuess(); refreshSavGuess();
    checkFixedWarn();
  });
  $('#f-amount').addEventListener('input', () => { refreshIncGuess(); refreshSavGuess(); });
  $('#f-kind').addEventListener('click', e => { const b = e.target.closest('button[data-kind]'); if (!b) return; sheet.kind = b.dataset.kind; renderSheetKind(); refreshIncGuess(); refreshSavGuess(); checkFixedWarn(); });
  $('#f-fixedwarn').addEventListener('click', e => {
    const b = e.target.closest('[data-fixact]'); if (!b) return;
    if (b.dataset.fixact === 'out') { sheet.kind = 'out'; sheet.fix = ''; } else { sheet.kind = 'fixed'; sheet.fix = b.dataset.fixact; }
    renderSheetKind(); checkFixedWarn();
  });
  $('#f-savs').addEventListener('click', e => { const b = e.target.closest('button[data-sav]'); if (!b) return; sheet.sav = b.dataset.sav; sheet.savTouched = true; renderSheetSavs(); });
  $('#f-incs').addEventListener('click', e => { const b = e.target.closest('button[data-inc]'); if (!b) return; sheet.inc = b.dataset.inc; sheet.incTouched = true; renderSheetIncs(); });
  $('#f-cats').addEventListener('click', e => { const b = e.target.closest('button[data-cat]'); if (!b) return; sheet.cat = b.dataset.cat; sheet.catTouched = true; renderSheetCats(); });

  /* redraw charts on resize / theme change */
  let rz = null;
  const redraw = () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'mois' && S.loaded) { const s = stats(S.ym); drawHero(); drawPace(s); drawHistory(s); } }, 120); };
  window.addEventListener('resize', redraw);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw); } catch (e) { /* ancien navigateur */ }
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

bind();
handleRoute();
render();
handleQuery();
initStore();
})();
</script>
